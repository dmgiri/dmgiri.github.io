{

options: [
"₹480 कोटी",
"₹500 कोटी",
"₹520 कोटी",
"₹1,000 कोटी"

answer: 2,

},

{
question: "GDP = ₹1,000 कोटी आणि घसारा = ₹100 कोटी असल्यास NDP किती?",
options: [

"₹1,100 कोटी",

],
answer: 0,

},

question: "खालीलपैकी कोणता व्यवहार GDP मध्ये समाविष्ट केला जात नाही?",
options: [

answer: 2,

},

{
question: "Transfer Payments राष्ट्रीय उत्पन्नात थेट का समाविष्ट केली जात नाहीत?",
options: [
"ती बेकायदेशीर आहेत",
"त्यांच्या बदल्यात चालू उत्पादनाची वस्तू किंवा सेवा मिळत नाही",
"त्यांच्यावर नेहमी कर असतो",
"ती फक्त सरकार देते"
],
answer: 1,
explanation: "Transfer Payment च्या बदल्यात सध्याच्या उत्पादनासाठी कोणतीही वस्तू किंवा सेवा दिली जात नाही."
},

{
question: "नाममात्र GDP आणि वास्तविक GDP यांतील मुख्य फरक कशामुळे निर्माण होतो?",
options: [
"लोकसंख्या",
"किंमत पातळीतील बदल",
"बेरोजगारी",

],
answer: 1,

},

{
question: "वास्तविक GDP आर्थिक वाढ मोजण्यासाठी अधिक उपयुक्त का असतो?",
options: [
"तो फक्त निर्यात मोजतो",

],
answer: 2,
explanation: "Real GDP मध्ये किंमत पातळीतील बदलांचा प्रभाव वेगळा केल्यामुळे वास्तविक उत्पादनवाढ अधिक स्पष्ट होते."
},

{

options: [
"2004-05",
"2011-12",
"2020-21",
"2022-23"
],
answer: 3,

},

{
question: "भारताच्या राष्ट्रीय उत्पन्नाच्या अधिकृत आकडेवारीशी संबंधित प्रमुख सांख्यिकीय संस्था कोणती?",
options: [
"RBI",
"NSO",
"SEBI",
"NITI आयोग"
],
answer: 1,
explanation: "NSO म्हणजे National Statistical Office. हे MoSPI अंतर्गत कार्य करते."
},

{
question: "NSO कोणत्या मंत्रालयाच्या अंतर्गत कार्य करते?",
options: [
"वित्त मंत्रालय",

],
answer: 2,
explanation: "NSO हे Ministry of Statistics and Programme Implementation (MoSPI) अंतर्गत कार्य करते."
},

{
question: "खालीलपैकी योग्य संबंध कोणता?",

answer: 1,

{

],

{

answer: 3,

}

];

let score = 0;
let answered = 0;

document.getElementById("total").textContent = questions.length;

function loadQuiz() {

const quiz = document.getElementById("quiz");

quiz.innerHTML = "";

questions.forEach((q, index) => {

    const card = document.createElement("div");
    card.className = "question-card";

    const number = document.createElement("div");
    number.className = "question-number";
    number.textContent = "प्रश्न " + (index + 1);

    const question = document.createElement("div");
    question.className = "question";
    question.textContent = q.question;

    card.appendChild(number);
    card.appendChild(question);

    q.options.forEach((option, optionIndex) => {

        const button = document.createElement("button");

        button.className = "option";

        button.textContent =
            String.fromCharCode(65 + optionIndex) + ") " + option;

        button.onclick = function() {

            if (card.dataset.answered === "true") {
                return;
            }

            card.dataset.answered = "true";
            answered++;

            const allOptions =
                card.querySelectorAll(".option");

            allOptions.forEach((btn, i) => {

                btn.disabled = true;

                if (i === q.answer) {
                    btn.classList.add("correct");
                }

            });

            const result = card.querySelector(".result");

            if (optionIndex === q.answer) {

                score++;

                result.className =
                    "result correct-result";

                result.innerHTML =
                    "✅ <strong>बरोबर उत्तर!</strong>" +
                    "<div class='explanation'>" +
                    q.explanation +
                    "</div>";

            } else {

                button.classList.add("wrong");

                result.className =
                    "result wrong-result";

                result.innerHTML =
                    "❌ <strong>चुकीचे उत्तर!</strong>" +
                    "<div class='explanation'>" +
                    "योग्य उत्तर: <strong>" +
                    String.fromCharCode(65 + q.answer) +
                    ") " +
                    q.options[q.answer] +
                    "</strong><br><br>" +
                    q.explanation +
                    "</div>";
            }

            result.style.display = "block";

            updateScore();

            if (answered === questions.length) {
                showFinalResult();
            }

        };

        card.appendChild(button);

    });

    const result = document.createElement("div");

    result.className = "result";

    card.appendChild(result);

    quiz.appendChild(card);

});


}

function updateScore() {

document.getElementById("score").textContent = score;

const percentage =
    (answered / questions.length) * 100;

document.getElementById("progressBar").style.width =
    percentage + "%";


}

function showFinalResult() {

const finalResult =
    document.getElementById("finalResult");

const finalScore =
    document.getElementById("finalScore");

const finalMessage =
    document.getElementById("finalMessage");

const percentage =
    Math.round((score / questions.length) * 100);

finalScore.textContent =
    "तुमचा Score: " +
    score +
    " / " +
    questions.length +
    " (" +
    percentage +
    "%)";

if (percentage >= 80) {

    finalMessage.textContent =
        "🔥 उत्कृष्ट! MPSC साठी तुमची तयारी चांगली आहे.";

} else if (percentage >= 60) {

    finalMessage.textContent =
        "👍 चांगली कामगिरी! काही संकल्पना पुन्हा revise करा.";

} else {

    finalMessage.textContent =
        "📚 राष्ट्रीय उत्पन्नाचा topic पुन्हा एकदा revise करा.";

}

finalResult.style.display = "block";

finalResult.scrollIntoView({
    behavior: "smooth"
});


}

function restartQuiz() {

score = 0;
answered = 0;

document.getElementById("finalResult").style.display =
    "none";

updateScore();

loadQuiz();

window.scrollTo({
    top: 0,
    behavior: "smooth"
});


}

loadQuiz();

</script> </body> </html>
